{% extends 'admin_panel/base.html' %}

{% block content %}
<div class="space-y-6">
    <!-- Judul Halaman -->
    <h1 class="text-2xl font-bold tracking-tight text-gray-900">Ekspor Laporan</h1>

    <!-- Form Kartu Ekspor Laporan -->
    <div class="max-w-xl space-y-5 rounded-2xl bg-white p-6 shadow-sm border border-gray-100">
        <form action="" method="POST" class="space-y-5">
            {% csrf_token %}
            
            <!-- Rentang Tanggal -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dari tanggal</label>
                    <input type="date" name="dari_tanggal" required class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sampai tanggal</label>
                    <input type="date" name="sampai_tanggal" required class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
                </div>
            </div>

            <!-- Jenis Laporan -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jenis laporan</label>
                <select name="jenis_laporan" class="w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:border-orange-500 focus:outline-none bg-white">
                    <option value="Pendapatan">Pendapatan</option>
                    <option value="Pesanan">Pesanan</option>
                    <option value="Manifest peserta">Manifest peserta</option>
                </select>
            </div>

            <!-- Tombol Aksi Ekspor (Excel & PDF) -->
            <div class="flex gap-3 pt-2">
                <button type="submit" name="format" value="excel" class="flex-1 flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 transition">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Excel
                </button>
                <button type="submit" name="format" value="pdf" class="flex-1 flex items-center justify-center gap-2 rounded-xl bg-rose-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-rose-500 transition">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    PDF
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
