{% if page_obj.paginator.num_pages > 1 %}
<div class="flex items-center justify-between px-6 py-4 border-t border-slate-100 text-sm text-slate-500">
    <span>Halaman {{ page_obj.number }} dari {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} data)</span>
    <div class="flex gap-2">
        {% if page_obj.has_previous %}<a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.previous_page_number }}" class="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50">&laquo; Sebelumnya</a>{% endif %}
        {% if page_obj.has_next %}<a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.next_page_number }}" class="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50">Berikutnya &raquo;</a>{% endif %}
    </div>
</div>
{% endif %}
